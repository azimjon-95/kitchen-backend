# Render Blueprint: https://render.com → New → Blueprint → этот репозиторий
services:
  # Распознавание речи GigaAM (CPU). Нужен план с ≥ 2 ГБ памяти (Standard); на free/starter модель не поместится.
  - type: pserv
    name: clean-kitchen-stt
    runtime: docker
    rootDir: services/stt-gigaam
    plan: standard
    envVars:
      - key: STT_SERVICE_TOKEN
        generateValue: true
      - key: GIGAAM_MODEL
        value: v3_e2e_rnnt
  - type: web
    name: clean-kitchen-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false            # строка подключения MongoDB Atlas
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clean-kitchen-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GIGAAM_URL        # внутренний адрес сервиса распознавания GigaAM (http://host:port)
        fromService:
          type: pserv
          name: clean-kitchen-stt
          property: hostport
      - key: STT_SERVICE_TOKEN
        fromService:
          type: pserv
          name: clean-kitchen-stt
          envVarKey: STT_SERVICE_TOKEN
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false            # https://ваш-клиент.vercel.app (тот же, что CLIENT_ORIGIN)
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: LEGACY_API
        value: "off"
      - key: CLIENT_ORIGIN
        sync: false            # https://ваш-клиент.vercel.app
      - key: ADMIN_ORIGIN
        value: http://localhost:5174
      - key: ADMIN_NAME
        value: Администратор
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COST_CURRENCY
        value: UZS

  - type: keyvalue
    name: clean-kitchen-redis
    plan: free
    ipAllowList: []          # доступ только из сервисов Render
    maxmemoryPolicy: allkeys-lru
