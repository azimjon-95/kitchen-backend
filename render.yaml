# Render Blueprint: https://render.com → New → Blueprint → этот репозиторий
services:
  - type: web
    name: clean-kitchen-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false            # строка подключения MongoDB Atlas
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false            # https://ваш-клиент.vercel.app
      - key: ADMIN_ORIGIN
        value: http://localhost:5174
      - key: ADMIN_NAME
        value: Администратор
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COST_CURRENCY
        value: UZS
